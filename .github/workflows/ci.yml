name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ./scripts/fetch_vendored.sh
      - run: python -m playwright install --with-deps chromium   # the career-form tests drive a real browser
      - run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: agentic-job-seeker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run --rm --entrypoint sh agentic-job-seeker:ci -c 'command -v pdftotext && command -v bun'
          docker run -d --name ajs -e JOBHUB_API_TOKEN=$(openssl rand -hex 32) -p 8000:8000 agentic-job-seeker:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 2; done
          docker logs ajs; exit 1

  mailflare:
    # Mailflare's Next.js build needs ~7 GB of build cache, more than the 30 GB server can spare, so it is built here
    # on a native arm64 runner (the server is Graviton) and pushed to GHCR; the server only pulls it. The upstream
    # commit is the image tag in deploy/docker-compose.yml (one place to bump it).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Upstream commit from docker-compose.yml
        id: ref
        run: |
          REF=$(grep -oE 'ghcr.io/yashjadhav1023/mailflare:[0-9a-f]{40}' deploy/docker-compose.yml | head -1 | cut -d: -f2)
          test -n "$REF" || { echo "::error::no pinned mailflare image in deploy/docker-compose.yml"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already built?
        id: have
        env:
          IMAGE: ghcr.io/yashjadhav1023/mailflare:${{ steps.ref.outputs.ref }}
        run: if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
        if: steps.have.outputs.yes != '1'
      - name: Build and push
        if: steps.have.outputs.yes != '1'
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/hieunc229/mailflare.git#${{ steps.ref.outputs.ref }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/yashjadhav1023/mailflare:${{ steps.ref.outputs.ref }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the APK to GitHub Releases on v* tags
    defaults: {run: {working-directory: mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.47.8", channel: stable, cache: true}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Decode release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks" && echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/agentic-job-seeker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-job-seeker-apk
          path: mobile/build/agentic-job-seeker.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/agentic-job-seeker.apk
          generate_release_notes: true
