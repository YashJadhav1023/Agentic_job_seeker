name: Deploy

# Continuous deployment to the EC2 host created by deploy/aws/cloudformation.yaml.
# Auth is GitHub OIDC -> IAM role (no AWS keys stored in GitHub). The role may only run
# AWS-RunShellScript on that one instance. Configure once in GitHub > Settings > Secrets and variables > Actions > Variables:
#   AWS_DEPLOY_ROLE_ARN, AWS_REGION, EC2_INSTANCE_ID   (all printed as CloudFormation stack outputs)
# Until those variables exist this workflow skips itself, so CI stays green.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Pull + rebuild on the instance (SSM Run Command)
        id: send
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" \
            --timeout-seconds 1800 \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /opt/ajs\",
              \"git fetch --depth 1 origin ${SHA}\",
              \"git checkout --force ${SHA}\",
              \"cd deploy && docker compose up -d --build --remove-orphans\",
              \"docker image prune -f\",
              \"for i in \$(seq 1 30); do docker compose exec -T jobhub curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 5; done; docker compose logs --tail 80 jobhub; exit 1\"
            ]" \
            --query Command.CommandId --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for result
        run: |
          set -uo pipefail
          ID=${{ steps.send.outputs.id }}
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 60
          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]
