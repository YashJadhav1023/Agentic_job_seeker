name: Deploy

# Continuous deployment: after CI passes on main, pull the commit on the EC2 host and rebuild the containers
# through SSM Run Command (no SSH port, no inbound access). Uses repository secrets
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY. The instance is found by its Project tag (created by Terraform), so
# there is nothing else to configure. Skips cleanly when the secrets or the instance do not exist yet.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT: agentic-job-seeker

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - name: Find instance
        id: find
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then echo "::notice::AWS secrets not set - skipping deploy"; exit 0; fi
          ID=$(aws ec2 describe-instances \
                 --filters "Name=tag:Project,Values=$PROJECT" "Name=instance-state-name,Values=running" \
                 --query 'Reservations[0].Instances[0].InstanceId' --output text 2>/dev/null || true)
          if [ -z "$ID" ] || [ "$ID" = "None" ]; then echo "::notice::no running instance tagged Project=$PROJECT - run the Terraform workflow first"; exit 0; fi
          echo "instance=$ID" >> "$GITHUB_OUTPUT"

      - name: Pull + rebuild on the instance
        id: send
        if: steps.find.outputs.instance != ''
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INSTANCE: ${{ steps.find.outputs.instance }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE" --document-name AWS-RunShellScript \
            --comment "deploy ${SHA::7}" --timeout-seconds 1800 \
            --parameters "commands=[
              \"set -eu\",
              \"cd /opt/ajs\",
              \"git fetch --depth 1 origin ${SHA}\",
              \"git checkout --force ${SHA}\",
              \"cd deploy && docker compose up -d --build --remove-orphans\",
              \"docker image prune -f\",
              \"for i in \$(seq 1 30); do docker compose exec -T jobhub curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 5; done; docker compose logs --tail 80 jobhub; exit 1\"
            ]" --query Command.CommandId --output text)
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for result
        if: steps.send.outputs.id != ''
        env:
          INSTANCE: ${{ steps.find.outputs.instance }}
          CMD_ID: ${{ steps.send.outputs.id }}
        run: |
          set -uo pipefail
          for i in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                     --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 10
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -n 60
          echo "status: $STATUS"
          [ "$STATUS" = "Success" ]
