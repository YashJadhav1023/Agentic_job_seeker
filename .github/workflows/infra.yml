name: Infra (AWS)

# Manually creates/updates the AWS stack (EC2 + Elastic IP + security group + SSM role + $1 budget alarm).
# Needs repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Run it from Actions > Infra (AWS) > Run workflow.
# Use "plan" first: it shows the change set without applying anything.

on:
  workflow_dispatch:
    inputs:
      action:
        description: plan = show change set only; apply = create/update; destroy = delete everything
        type: choice
        options: [plan, apply, destroy]
        default: plan
      budget_email:
        description: Email for the cost alarm
        required: true
      instance_type:
        type: choice
        options: [t4g.small, t4g.micro, t3.small, t3.micro]
        default: t4g.small
      domain:
        description: Optional domain pointing at the Elastic IP (empty = <ip>.sslip.io)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  STACK: agentic-job-seeker

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - name: Lint template
        run: pipx run cfn-lint deploy/aws/cloudformation.yaml

      - name: Plan (change set)
        if: inputs.action != 'destroy'
        run: |
          aws cloudformation deploy --stack-name "$STACK" --template-file deploy/aws/cloudformation.yaml \
            --capabilities CAPABILITY_IAM --no-execute-changeset --no-fail-on-empty-changeset \
            --parameter-overrides BudgetEmail="${{ inputs.budget_email }}" InstanceType="${{ inputs.instance_type }}" \
                                  Domain="${{ inputs.domain }}"
          aws cloudformation list-change-sets --stack-name "$STACK" --query 'Summaries[0].[ChangeSetName,Status]' --output text || true
          CS=$(aws cloudformation list-change-sets --stack-name "$STACK" --query 'Summaries[0].ChangeSetName' --output text)
          aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$CS" \
            --query 'Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType]' --output table || true

      - name: Apply
        if: inputs.action == 'apply'
        run: |
          aws cloudformation deploy --stack-name "$STACK" --template-file deploy/aws/cloudformation.yaml \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset \
            --parameter-overrides BudgetEmail="${{ inputs.budget_email }}" InstanceType="${{ inputs.instance_type }}" \
                                  Domain="${{ inputs.domain }}"
          {
            echo "### Deployed"
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query 'Stacks[0].Outputs[?OutputKey!=`GetCredentials`].[OutputKey,OutputValue]' --output text | sed 's/\t/ : /'
            echo
            echo "First boot installs Docker and builds the image (~10 min). Then fetch the API token once:"
            echo '`aws ssm start-session --target <InstanceId>` then `sudo cat /root/ajs-credentials.txt`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy
        if: inputs.action == 'destroy'
        run: |
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"
