# Agentic Job Seeker profile: single source of truth. The app edits this file (Settings -> Profile).
# Secrets do NOT go here. They live in ./.secrets/ (0600) or the server .env and are set from the app.
# Quick start: upload your resume in the app. Contact fields still at these placeholders and search.skills are
# filled from it automatically; set search.auto_from_resume: true to also let it pick the job titles to search.

applicant:
  name: Your Name
  email: you@example.com
  phone: "+91XXXXXXXXXX"
  current_location: Pune
  location: {city: Pune, state: Maharashtra, country: India}   # used to fill application forms
  linkedin: https://linkedin.com/in/your-handle
  github: https://github.com/your-handle
  resume_path: /app/data/resume.pdf     # uploaded from the app (Settings -> Resume); always the latest upload
  headline: DevOps & Cloud Engineer
  experience_years: "1"
  willing_to_relocate: "Yes"
  gender: ""                            # optional; filled into "Gender" questions. Empty = "prefer not to say" when offered
  education: {highest_level: "Bachelor's", degree: "B.Tech Computer Science", university: "Your College", graduation_year: "2025", gpa: ""}
  cover_note: ""                        # optional short note for application forms; empty = built from this profile

experience:
  current_company: Your Company
  current_title: DevOps Engineer
  role_label: DevOps & Cloud Engineer

compensation:
  expected_ctc_inr: 600000
  min_ctc_inr: 450000
  current_ctc_inr: 0
  notice_period_days: 30

search:
  auto_from_resume: true          # on resume upload, also replace keywords/title rules (needs an LLM, see llm:)
  # Job titles searched on LinkedIn, Naukri and in hiring posts (every keyword x location, rotated across runs)
  keywords:
    - DevOps Engineer
    - Cloud Engineer
    - Site Reliability Engineer
    - Platform Engineer
  # Hard title filter applied before ANY application is submitted (regex)
  title_include: "devops|cloud|sre|site reliability|kubernetes|platform engineer|infrastructure"
  title_exclude: "senior|\\bsr\\b|\\blead\\b|manager|architect|principal|\\bhead\\b|\\bstaff\\b|director|\\bvp\\b|\\bintern\\b"
  locations: [Pune, Bangalore, Hyderabad, Remote]   # any city names; "Remote" also works
  experience_years_filter: "0-3"
  skills: []                      # filled from your resume; used to score jobs for any profession

limits:
  max_applies_per_run_per_platform: 15
  max_applies_per_day_total: 25
  delay_between_jobs_sec: 8
  delay_between_searches_sec: 5

browser:
  headless: true                  # apply runs in a hidden browser; login_platform is always visible

hr_outreach:
  industries: ["IT services", "software product company"]
  cities:
    - {country: India, state: Maharashtra, city: Pune}
    - {country: India, state: Karnataka, city: Bengaluru}
  company_sizes: ["51-200", "201-500", "501-1000", "1001-5000"]
  min_confidence: medium          # high | medium | low  (low = unverified guesses, never sent by default)
  max_emails_per_day: 20
  one_email_per_company_days: 60
  send_delay_sec: [45, 90]
  gmail_user: you@gmail.com       # set from the app (Settings -> Linked accounts -> Gmail)

safety:
  dry_run_default: true           # tools default to dry-run
  confirmed_by_user: false        # real submissions/sends are refused until you set this to true

autopilot:
  min_score: 45                   # jobs scoring below this vs your resume are skipped
  max_discover: 30                # new job pages read per run
  max_search_queries: 6           # keyword x location searches per platform per run (rotates through all of them)
  job_age_days: 7
  max_emails_per_run: 8
  max_lookups: 15
  send_window: null               # null = emails may go out any time, any day. Or e.g. [9, 19] (hours, end exclusive)
  send_days: null                 # null = every day. Or e.g. [mon, tue, wed, thu, fri]
  schedule_every_hours: 0         # built-in 24/7 scheduler: run the autopilot every N hours (0 = off)
  scan_posts: false               # also scan LinkedIn hiring posts during each autopilot run
  use_jobspy: false               # also pull jobs from JobSpy (LinkedIn guest API, Naukri, Indeed; no login)
  career_apply: true              # fill + submit application forms of good jobs on company career pages
  career_resolve: true            # for board jobs (LinkedIn/Indeed/Naukri/Google) find the same role on the company's own
                                  # site first: board's direct link, public ATS (Greenhouse/Lever/Ashby/SmartRecruiters/
                                  # Workable), web search, then the careers page via Firecrawl. Not found -> email.
  career_resolve_max_per_run: 15
  career_resolve_firecrawl: true  # uses Firecrawl credits; false = free sources only
  career_apply_max_per_run: 10    # forms per autopilot run
  career_apply_max_per_day: 40    # forms per day (also counts toward limits.max_applies_per_day_total)
  career_apply_company_days: 30   # at most one form per company within this many days
  career_apply_retry_days: 3      # wait before retrying a form that could not be completed
  career_apply_max_attempts: 2    # give up on a job after this many failed attempts (it then falls back to email)
  apply_limits: {naukri: 10, linkedin: 5}
  platform_cooldown_hours: 24
  company_blocklist: [jobgether]
  polish_model: ""

llm:
  # Used to analyse hiring posts and to read your resume. kiro needs KIRO_API_KEY (Kiro Pro+, set it in the app:
  # Settings -> Secrets -> kiro_api_key, or in the server .env). ollama = local model. openai = any OpenAI-compatible
  # API (DeepSeek, OpenRouter, Groq ...) with key llm_api_key. none = regex rules only.
  provider: none                  # kiro | ollama | openai | none
  model: ""                       # e.g. qwen3:8b (ollama), deepseek-chat (openai); empty = provider default (kiro)
  batch_size: 8                   # posts per LLM request
  # ollama_url: http://127.0.0.1:11434
  # base_url: https://api.deepseek.com/v1

post_scan:
  schedule_every_hours: 0         # built-in scheduler for the hiring-post scan (0 = off)
  max_queries: 12                 # LinkedIn content searches per scan (rotates through keywords x locations)
  include_feed: false             # also read your LinkedIn home feed
  date_posted: past-week          # past-24h | past-week | past-month
  companies: [all]                # or a list of target companies
  extra_queries: []
  alert_telegram: true

notifications:
  telegram_chat_id: ""            # with secret telegram_bot_token: one Telegram message per matching hiring post
  # Phone push via ntfy (open source; install the ntfy app and subscribe to this topic). Use a long random topic name:
  # anyone who knows it can read the alerts. Used for "the bot needs you" (login / human check during a run).
  ntfy_topic: ""
  ntfy_server: https://ntfy.sh

human_help:
  # When a site needs a login (Workday, Deloitte, ...) or shows an "are you human" check (Naukri), the run pauses, you get
  # a notification with a link to the remote browser, you finish that step yourself, and the bot carries on.
  # The bot never tries to get past such checks by itself.
  enabled: true
  wait_minutes: 15
