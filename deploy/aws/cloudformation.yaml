AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Agentic Job Seeker on one free-tier EC2 instance (Docker + Caddy HTTPS). 24/7, no load balancer, no NAT,
  no RDS - only free-tier-eligible pieces. Access the box through SSM Session Manager (no SSH port needed).

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.micro, t3.small, t3.micro, m7i-flex.large]
    Description: >
      t4g.small (ARM, 2 GB) = best value (same price as t3.micro, 2x RAM). t3.* = x86.
      m7i-flex.large (8 GB) is fastest but ~4x the cost.
  RepoUrl:
    Type: String
    Default: https://github.com/YashJadhav1023/Agentic_job_seeker.git
  Domain:
    Type: String
    Default: ""
    Description: >
      Optional DNS name you own pointing at the Elastic IP. Leave empty to use <ip>.sslip.io (free, no DNS setup).
  SshCidr:
    Type: String
    Default: ""
    Description: Optional CIDR allowed to SSH (e.g. 203.0.113.4/32). Empty = SSH closed; use SSM Session Manager.
  BudgetEmail:
    Type: String
    Description: Email for the cost alarm (alerts as soon as any real charge is forecast).
  AmiArm64:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
  AmiAmd64:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]
  HasDomain: !Not [!Equals [!Ref Domain, ""]]
  IsArm: !Or [!Equals [!Ref InstanceType, t4g.small], !Equals [!Ref InstanceType, t4g.micro]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  Profile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref Role]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Agentic Job Seeker - HTTPS only (HTTP for ACME + redirect)
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}

  SshRule:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !GetAtt SecurityGroup.GroupId
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [IsArm, !Ref AmiArm64, !Ref AmiAmd64]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref Profile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      # "standard" CPU credits: a busy instance is throttled instead of billed for T3 Unlimited surplus credits.
      CreditSpecification: {CPUCredits: standard}
      MetadataOptions: {HttpTokens: required}
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: {VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
      Tags: [{Key: Name, Value: agentic-job-seeker}]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/ajs-bootstrap.log 2>&1
          # 4 GB swap: Chromium + Python on a 1-2 GB instance needs it.
          if [ ! -f /swapfile ]; then
            fallocate -l 4G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
            sysctl -w vm.swappiness=20 && echo 'vm.swappiness=20' > /etc/sysctl.d/90-swap.conf
          fi
          apt-get update
          apt-get install -y ca-certificates curl git openssl unattended-upgrades
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
          systemctl enable --now docker
          # Elastic IP is associated after boot; wait for it (IMDSv2).
          for i in $(seq 1 60); do
            T=$(curl -sX PUT http://169.254.169.254/latest/api/token -H 'X-aws-ec2-metadata-token-ttl-seconds: 60')
            IP=$(curl -s -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/public-ipv4 || true)
            [ "$IP" = "${ElasticIp}" ] && break
            sleep 5
          done
          DOMAIN="${Domain}"
          [ -z "$DOMAIN" ] && DOMAIN="$(echo ${ElasticIp} | tr . -).sslip.io"
          [ -d /opt/ajs ] || git clone --depth 1 ${RepoUrl} /opt/ajs
          cd /opt/ajs/deploy
          [ -f .env ] || ./setup.sh "$DOMAIN" > /root/ajs-credentials.txt
          chmod 600 /root/ajs-credentials.txt .env
          docker compose up -d --build
          echo "ready: https://$DOMAIN" >> /root/ajs-credentials.txt

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{Key: Name, Value: agentic-job-seeker}]

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: agentic-job-seeker-guard
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: 1, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  ServerUrl:
    Description: Put this in the app (Settings > Server URL)
    Value: !If
      - HasDomain
      - !Sub https://${Domain}
      - !Join ["", ["https://", !Join ["-", !Split [".", !Ref ElasticIp]], ".sslip.io"]]
  PublicIp:
    Value: !Ref ElasticIp
  GetCredentials:
    Description: Prints the API token + remote-browser login (via SSM, no SSH needed)
    Value: !Sub aws ssm start-session --target ${Instance} --region ${AWS::Region}   # then: sudo cat /root/ajs-credentials.txt
  InstanceId:
    Description: Used by the Deploy workflow (looked up automatically from this stack)
    Value: !Ref Instance
