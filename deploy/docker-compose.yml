# Cloud VM stack: Caddy (automatic HTTPS) -> Agentic Job Seeker API. Run from this folder:
#   ./setup.sh                    # first time: writes .env with random token/passwords
#   docker compose up -d --build
services:
  jobhub:
    build:
      context: ../backend
      args:
        INSTALL_KIRO: "${JOBHUB_INSTALL_KIRO:-0}"   # 1 = include kiro-cli for LLM post analysis (needs KIRO_API_KEY in .env)
    image: agentic-job-seeker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      JOBHUB_TRUST_PROXY: "1"
      JOBHUB_MAX_PARALLEL: "${JOBHUB_MAX_PARALLEL:-6}"   # 6 parallel runs with Moli (~40MB RAM/run)
      JOBHUB_REMOTE_BROWSER_URL: "https://${JOBHUB_DOMAIN}/browser/vnc.html?path=browser/websockify&autoconnect=1&resize=scale"
    volumes:
      - jobhub-data:/app/data          # profile.yaml, hub.db, resume.pdf, STOP switch
      - jobhub-runs:/app/runs          # background run logs
      - jobhub-secrets:/app/.secrets   # gmail_app_password (0600)
      - jobhub-profiles:/app/.profiles # saved LinkedIn/Naukri/Indeed browser sessions
    shm_size: "1gb"                    # Chromium crashes with the 64 MB default
    expose: ["8000", "6080"]           # internal only; Caddy is the single public entrypoint
    deploy:
      resources:
        limits: {memory: 3g}

  # WhatsApp gateway: the upstream Evolution Go image + its PostgreSQL. Started only with COMPOSE_PROFILES=whatsapp
  # (an SSM env parameter). Not published to the internet: the app reaches it on the compose network and you reach
  # its Manager page through an SSM port-forward to 127.0.0.1:4000.
  evolution-postgres:
    profiles: ["whatsapp"]
    image: postgres:16-alpine
    restart: unless-stopped
    # Evolution Go leaves idle connections behind on every reconnect; at the default limit of 100 the gateway could no
    # longer create the WhatsApp client ("too many clients already") and the QR never connected.
    command: ["postgres", "-c", "max_connections=200", "-c", "idle_session_timeout=600000"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${EVOLUTION_DB_PASSWORD:-}"
    volumes:
      - evolution-pg:/var/lib/postgresql/data
      - ./evolution/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits: {memory: 256m}

  evolution-go:
    profiles: ["whatsapp"]
    image: evoapicloud/evolution-go:0.7.2   # upstream, multi-arch (arm64 ok)
    restart: unless-stopped
    depends_on:
      evolution-postgres: {condition: service_healthy}
    ports: ["127.0.0.1:4000:4000"]
    environment:
      SERVER_PORT: "4000"
      CLIENT_NAME: "jobseeker"
      GLOBAL_API_KEY: "${JOBHUB_EVOLUTION_KEY:-}"
      POSTGRES_AUTH_DB: "postgresql://postgres:${EVOLUTION_DB_PASSWORD:-}@evolution-postgres:5432/evogo_auth?sslmode=disable"
      POSTGRES_USERS_DB: "postgresql://postgres:${EVOLUTION_DB_PASSWORD:-}@evolution-postgres:5432/evogo_users?sslmode=disable"
      DATABASE_SAVE_MESSAGES: "false"
      WADEBUG: "INFO"
      LOGTYPE: "console"
      WEBHOOK_FILES: "false"
      CONNECT_ON_STARTUP: "true"
      OS_NAME: "Job Seeker"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "10"
      AMQP_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
    deploy:
      resources:
        limits: {memory: 384m}

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [jobhub]
    env_file: .env
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  jobhub-data:
  jobhub-runs:
  jobhub-secrets:
  jobhub-profiles:
  evolution-pg:
  caddy-data:
  caddy-config:
